<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ADOVAN — Rekomendasi Shopee</title>
<meta name="description" content="Kurasi produk Shopee pilihan dengan harga promo terbaik." />
<meta name="theme-color" content="#0a0a0a" />

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --card-hover:#1a1a1a;
    --border:#222;
    --text:#f5f5f5;
    --muted:#888;
    --brand:#fbbf24;
    --brand-dark:#f59e0b;
    --green:#10b981;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .container{max-width:520px;margin:0 auto;padding:24px 16px 40px}

  /* HEADER */
  .header{text-align:center;margin-bottom:28px}
  .logo{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#0a0a0a;font-weight:900;font-size:24px;margin-bottom:14px;
    box-shadow:0 8px 24px rgba(251,191,36,.25);
  }
  .title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .title span{color:var(--brand)}
  .subtitle{font-size:13px;color:var(--muted);max-width:340px;margin:0 auto}

  /* SEARCH */
  .search{margin-bottom:16px}
  .search input{
    width:100%;padding:14px 16px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    color:var(--text);font-size:15px;font-family:inherit;outline:none;
    transition:border-color .2s;
  }
  .search input:focus{border-color:var(--brand)}
  .search input::placeholder{color:var(--muted)}

  /* CATEGORY */
  .categories{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
    margin-bottom:20px;scrollbar-width:none;
  }
  .categories::-webkit-scrollbar{display:none}
  .cat{
    flex-shrink:0;padding:8px 14px;
    background:var(--card);border:1px solid var(--border);border-radius:100px;
    color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;
    cursor:pointer;white-space:nowrap;transition:all .2s;
  }
  .cat.active{background:var(--brand);border-color:var(--brand);color:#0a0a0a}

  /* LIST */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{
    display:block;padding:16px;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    text-decoration:none;color:inherit;transition:all .2s;
  }
  .item:active{background:var(--card-hover);border-color:var(--brand);transform:scale(.99)}
  .item-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;margin-bottom:8px;
  }
  .item-title{font-size:14px;font-weight:700;line-height:1.35;color:var(--text);flex:1}
  .item-badge{
    flex-shrink:0;padding:3px 8px;
    background:rgba(251,191,36,.12);color:var(--brand);
    border-radius:6px;font-size:10px;font-weight:800;
    letter-spacing:.03em;text-transform:uppercase;
  }
  .item-price{
    font-size:16px;font-weight:800;color:var(--green);
    letter-spacing:-.01em;margin-bottom:6px;
  }
  .item-meta{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--muted);margin-bottom:12px;
  }
  .item-meta .star{color:var(--brand)}
  .item-meta .dot{opacity:.4}
  .item-bottom{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:12px;border-top:1px solid var(--border);
  }
  .item-cta{font-size:12px;font-weight:700;color:var(--brand)}
  .item-arrow{font-size:14px;color:var(--brand);transition:transform .2s}
  .item:active .item-arrow{transform:translate(2px,-2px)}

  /* EMPTY */
  .empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:13px}

  /* FOOTER */
  .footer{
    text-align:center;margin-top:32px;padding-top:24px;
    border-top:1px solid var(--border);font-size:11px;color:var(--muted);
  }
  .footer a{color:var(--brand);text-decoration:none}

  /* TOAST */
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#1a1a1a;border:1px solid var(--border);color:var(--text);
    padding:12px 18px;border-radius:12px;
    font-size:13px;font-weight:600;opacity:0;
    transition:all .3s;pointer-events:none;z-index:50;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <div class="logo">A</div>
    <h1 class="title">ADOVAN</h1>
    <p class="subtitle">Kurasi produk Shopee pilihan dengan harga promo terbaik.</p>
  </header>

  <div class="search">
    <input type="search" id="search" placeholder="Cari produk..." autocomplete="off" />
  </div>

  <div class="categories" id="categories"></div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" style="display:none">
    Produk tidak ditemukan 🥲
  </div>

  <div class="footer">
    &copy; <span id="year"></span> Adovan · <a href="#" onclick="sharePage(event)">Bagikan halaman</a>
  </div>

</div>

<div class="toast" id="toast">Link disalin!</div>

<script>
/* =========================================================
   ⚙️ DATA PRODUK
   ========================================================= */

const PRODUCTS = [
  {
    title: "Vesper Mini Portable Coffee Traveller Set",
    desc: "Set lengkap alat kopi portable pour-over untuk coffee lover on-the-go.",
    category: "lifestyle",
    price: 256062,
    rating: 4.9,
    badge: "Coffee Lover",
    url: "https://s.shopee.co.id/2Vs7vncITp"
  },
  {
    title: "Acroder Action Camera 4K HD WiFi Mini",
    desc: "Kamera aksi mini 4K, layar 1.54\" IPS putar 270°, night vision.",
    category: "elektronik",
    price: 457757,
    rating: 4.8,
    badge: "Vlog Ready",
    url: "https://s.shopee.co.id/6AlQIcjD8g"
  },
  {
    title: "Starlink Mini — Portable WiFi Satelit",
    desc: "Internet satelit super cepat di mana saja. Cocok buat remote area.",
    category: "elektronik",
    price: 4674150,
    rating: 5.0,
    badge: "Premium",
    url: "https://s.shopee.co.id/8V9L4yX8C9"
  },
  {
    title: "Xiaomi Curved Gaming Monitor G34WQi 2026 — 34\" 180Hz",
    desc: "WQHD 1500R curved, 180Hz, 95% DCI-P3, HDR400. Monitor gaming gila.",
    category: "elektronik",
    price: 4793060,
    rating: 4.9,
    badge: "Gaming",
    url: "https://s.shopee.co.id/7AdxUYUBHB"
  },
  {
    title: "Midea Air Cooler AC100-A 6.0L 55W",
    desc: "Pendingin ruangan hemat listrik 55W dengan tangki 6 liter.",
    category: "lifestyle",
    price: 1231650,
    rating: 4.8,
    badge: "Hemat Listrik",
    url: "https://s.shopee.co.id/4B0Lv4AGr7"
  },
  {
    title: "NOD Maximo Smart Capsule Machine — All-in-One Drink Maker",
    desc: "Mesin kopi kapsul otomatis multifungsi untuk minuman favoritmu.",
    category: "lifestyle",
    price: 2931650,
    rating: 4.9,
    badge: "All-in-One",
    url: "https://s.shopee.co.id/1VzakDDi8w"
  }
];

/* =========================================================
   🔧 KATEGORI
   ========================================================= */

const CATEGORIES = [
  { id: "all",        label: "Semua" },
  { id: "elektronik", label: "Elektronik" },
  { id: "lifestyle",  label: "Home & Living" }
];

/* =========================================================
   🚀 LOGIC
   ========================================================= */

const state = { category: "all", query: "" };
const $ = (id) => document.getElementById(id);
const escape = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const formatRupiah = (n) => "Rp" + n.toLocaleString("id-ID");

function renderCategories() {
  $("categories").innerHTML = CATEGORIES.map(c =>
    `<button class="cat ${c.id === state.category ? "active" : ""}" data-id="${c.id}">${c.label}</button>`
  ).join("");
}

function renderList() {
  const q = state.query.toLowerCase().trim();
  const filtered = PRODUCTS.filter(p => {
    const matchCat = state.category === "all" || p.category === state.category;
    const haystack = (p.title + " " + (p.desc || "")).toLowerCase();
    const matchQ = !q || haystack.includes(q);
    return matchCat && matchQ;
  });

  if (filtered.length === 0) {
    $("list").innerHTML = "";
    $("empty").style.display = "block";
    return;
  }
  $("empty").style.display = "none";

  $("list").innerHTML = filtered.map(p => `
    <a class="item" href="${p.url}" target="_blank" rel="noopener noreferrer">
      <div class="item-top">
        <div class="item-title">${escape(p.title)}</div>
        ${p.badge ? `<span class="item-badge">${escape(p.badge)}</span>` : ""}
      </div>
      ${p.price ? `<div class="item-price">${formatRupiah(p.price)}</div>` : ""}
      <div class="item-meta">
        <span class="star">★</span>
        <span>${p.rating}</span>
        <span class="dot">•</span>
        <span>Shopee Official</span>
      </div>
      <div class="item-bottom">
        <span class="item-cta">Lihat di Shopee</span>
        <span class="item-arrow">↗</span>
      </div>
    </a>
  `).join("");
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function sharePage(e) {
  e.preventDefault();
  const url = location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast("Link disalin!"));
  }
}

$("categories").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat");
  if (!btn) return;
  state.category = btn.dataset.id;
  renderCategories();
  renderList();
});

let searchTimer;
$("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    renderList();
  }, 150);
});

$("year").textContent = new Date().getFullYear();
renderCategories();
renderList();
</script>
</body>
</html>
